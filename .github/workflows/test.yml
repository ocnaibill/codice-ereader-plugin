name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: syntax of every Lua file
        run: find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luajit -bl > /dev/null
      - name: logic that does not need KOReader
        run: luajit tests/run.lua && luajit tests/update_dirs.lua
